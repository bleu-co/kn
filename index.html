<!DOCTYPE html>
<html lang="en-GB" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kn</title>
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kn">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE   quiet, private, quick to reach for
   IDEA    a stack of loose notes, patched like a Pd canvas
   PICTURE the writing itself; the composer is a Pd object box with inlet and outlet
   COLOUR  two greys only, swapped by a Pd toggle
   TYPE    Inter for the writing, SF Mono for stamps, labels and controls */
:root{--bg:#141414;--ink:#ebebeb;--faint:rgba(235,235,235,.36);--hair:rgba(235,235,235,.14);--mark:rgba(235,235,235,.2);color-scheme:dark}
:root[data-mode=light]{--bg:#ebebeb;--ink:#141414;--faint:rgba(20,20,20,.4);--hair:rgba(20,20,20,.15);--mark:rgba(20,20,20,.16);color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.7 Inter,-apple-system,'Helvetica Neue',sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace;font-size:11px;line-height:1.2;letter-spacing:.03em}
main{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 76px) max(24px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 96px) max(24px,env(safe-area-inset-left))}
.bar{position:fixed;top:0;right:0;z-index:2;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 12px) max(12px,env(safe-area-inset-right)) 0 0}
#status{color:var(--faint)}
.tgl{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.tgl span{width:17px;height:17px;border:1px solid currentColor;position:relative;overflow:hidden}
.tgl[aria-pressed=true] span::before,.tgl[aria-pressed=true] span::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:1px;background:currentColor;transform:translate(-50%,-50%) rotate(45deg)}
.tgl[aria-pressed=true] span::after{transform:translate(-50%,-50%) rotate(-45deg)}
.tgl:focus-visible,.link:focus-visible,.pin:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.search{display:flex;align-items:baseline;gap:16px;margin:0 0 34px}
.search input{flex:1;border:0;border-bottom:1px solid var(--hair);border-radius:0;outline:0;background:transparent;color:var(--ink);padding:4px 0 7px;margin:0;caret-color:var(--ink);-webkit-appearance:none;appearance:none;font-size:13px}
.search input:focus{border-bottom-color:var(--faint)}
.search input::-webkit-search-cancel-button{display:none}
#count{color:var(--faint);white-space:nowrap}
.entry{margin:0 0 24px}
.row{display:flex;justify-content:space-between;align-items:center;min-height:16px;margin:0 0 7px}
.time{color:var(--faint);transition:color .2s}
.entry:focus-within .time,.n:focus-within .time{color:var(--ink)}
textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:inherit;font:inherit;padding:0;margin:0;overflow:hidden;field-sizing:content;min-height:1.7em;caret-color:var(--ink);white-space:pre-wrap;overflow-wrap:break-word}
textarea::placeholder,input::placeholder{color:var(--faint);font-style:italic}
.box{position:relative;border:1px solid var(--hair);padding:14px 16px 16px;transition:border-color .2s}
.box:focus-within{border-color:var(--faint)}
.box::before,.box::after{content:"";position:absolute;left:-1px;width:12px;height:3px;background:var(--faint)}
.box::before{top:-1px}.box::after{bottom:-1px}
#list{margin-top:40px}
.n{border-top:1px solid var(--hair);padding:20px 0 22px}
.ed{position:relative}
.ed textarea{position:relative;z-index:1}
.hl{position:absolute;inset:0;white-space:pre-wrap;overflow-wrap:break-word;color:transparent;pointer-events:none;user-select:none}
.hl mark{background:var(--mark);color:transparent;border-radius:2px}
.pin{display:flex;align-items:center;gap:7px;background:none;border:0;margin:-8px 0;padding:8px 0 8px 12px;color:var(--faint);cursor:pointer}
.pin span{width:11px;height:11px;border:1px solid currentColor;position:relative;overflow:hidden}
.pin[aria-pressed=true]{color:var(--ink)}
.pin[aria-pressed=true] span::before,.pin[aria-pressed=true] span::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:1px;background:currentColor;transform:translate(-50%,-50%) rotate(45deg)}
.pin[aria-pressed=true] span::after{transform:translate(-50%,-50%) rotate(-45deg)}
.pin:hover{color:var(--ink)}
.empty{color:var(--faint);border-top:1px solid var(--hair);padding:20px 0;margin:0}
.link{background:none;border:0;padding:6px 0;margin:0;color:var(--faint);cursor:pointer;min-height:28px}
.link:hover,.link[aria-expanded=true]{color:var(--ink)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 22px;border-top:1px solid var(--hair);padding-top:18px;color:var(--faint)}
.foot .right{display:flex;gap:22px;margin-left:auto}
.panel{border-top:1px solid var(--hair);padding:30px 0 34px}
.panel .entry:last-child{margin-bottom:0}
.field{display:block;margin:0 0 14px}
.field .mono{display:block;color:var(--faint);margin:0 0 4px}
.field input{display:block;width:100%;border:0;border-bottom:1px solid var(--hair);border-radius:0;outline:0;background:transparent;color:inherit;font:inherit;padding:2px 0 4px;margin:0;caret-color:var(--ink);-webkit-appearance:none;appearance:none}
.field input:focus{border-bottom-color:var(--faint)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:0 22px}
.note{color:var(--faint);margin:2px 0 0;line-height:1.6}
@media(max-width:600px){main{padding-top:calc(env(safe-area-inset-top) + 64px)}.hint{display:none}.search input{font-size:16px}}
@media(prefers-reduced-motion:reduce){body,.time,.box{transition:none}}
</style>
</head>
<body>
<div class="bar">
  <span id="status" class="mono" aria-live="polite"></span>
  <button id="tgl" class="tgl" aria-label="Dark mode" aria-pressed="true" title="Toggle light and dark"><span></span></button>
</div>
<main>
  <div class="search">
    <input id="q" class="mono" type="search" placeholder="search" aria-label="Search notes" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <span id="count" class="mono" aria-live="polite"></span>
  </div>
  <div class="entry" id="compose">
    <div class="row"><span id="compTime" class="time mono">now</span><button id="newBtn" class="link mono" hidden>new note</button></div>
    <div class="box"><textarea id="composer" rows="1" placeholder="Write a note" aria-label="New note" spellcheck="true"></textarea></div>
  </div>
  <div id="list"></div>
  <section id="panel" class="panel" hidden aria-label="Sync">
    <div class="entry">
      <div class="row"><span class="time mono">sync</span><span id="syncState" class="time mono"></span></div>
      <div class="box">
        <div id="setup">
          <label class="field"><span class="mono">private repository</span><input id="repo" placeholder="username/kn-data" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
          <label class="field"><span class="mono">access token</span><input id="token" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
        </div>
        <div class="acts">
          <button id="connectBtn" class="link mono">connect</button>
          <button id="syncBtn" class="link mono" hidden>sync now</button>
          <button id="disconnectBtn" class="link mono" hidden>disconnect this device</button>
        </div>
        <p id="syncMsg" class="note mono"></p>
      </div>
    </div>
    <div class="entry">
      <div class="row"><span class="time mono">import</span></div>
      <div class="box">
        <textarea id="importText" rows="3" placeholder="Paste text from “copy all as text”" aria-label="Text to import" spellcheck="false"></textarea>
        <div class="acts"><button id="importBtn" class="link mono">import</button></div>
      </div>
    </div>
  </section>
  <div class="foot mono">
    <span class="hint">cmd + enter starts a new note · cmd + f searches</span>
    <span class="right">
      <button id="syncLink" class="link mono" aria-expanded="false" aria-controls="panel">sync</button>
      <button id="copyBtn" class="link mono">copy all as text</button>
    </span>
  </div>
</main>
<script>
{
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
/* stamp: 22:11 24-11-26 */
const fmtStamp=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())+' '+pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+String(d.getFullYear()).slice(2)};
/* Kj and Kn share one github.io address, so they share localStorage: every key here starts with "n." */
const LS={get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

const statusEl=$('#status'),tgl=$('#tgl'),comp=$('#composer'),compTime=$('#compTime'),newBtn=$('#newBtn');
const list=$('#list'),qIn=$('#q'),countEl=$('#count');
const setStatus=t=>{statusEl.textContent=t};
const fits=window.CSS&&CSS.supports&&CSS.supports('field-sizing','content');
const autosize=t=>{if(fits)return;t.style.height='auto';t.style.height=t.scrollHeight+'px'};

/* ---------- local state ---------- */
const clean=(id,v)=>{
  if(!v||typeof v.ts!=='number')return null;
  return {id,ts:v.ts,text:String(v.text==null?'':v.text),u:typeof v.u==='number'?v.u:v.ts,pin:v.pin===true};
};
const pack=e=>{const o={ts:e.ts,text:e.text,u:e.u};if(e.pin)o.pin=true;return o};
let notes=new Map();
for(const [k,v] of Object.entries(LS.get('n.notes',{}))){const e=clean(k,v);if(e)notes.set(k,e)}
let dead=LS.get('n.dead',{})||{};
let mode=LS.get('n.mode','dark'),modeU=LS.get('n.modeU',0);
let cfg=LS.get('n.sync',null);
let dirty=LS.get('n.dirty',false);
let composerId=null,structKey='';
const nodes=new Map();
let cacheT=null;
const cacheNow=()=>{clearTimeout(cacheT);cacheT=null;
  LS.set('n.notes',Object.fromEntries([...notes].map(([k,e])=>[k,pack(e)])));
  LS.set('n.dead',dead);LS.set('n.mode',mode);LS.set('n.modeU',modeU);LS.set('n.dirty',dirty)};
const cacheSoon=()=>{if(!cacheT)cacheT=setTimeout(cacheNow,400)};
const changed=()=>{dirty=true;cacheSoon();schedulePush()};

const meta=document.querySelector('meta[name=theme-color]');
const applyMode=()=>{document.documentElement.dataset.mode=mode;tgl.setAttribute('aria-pressed',String(mode==='dark'));meta.content=mode==='dark'?'#141414':'#ebebeb'};
tgl.addEventListener('click',()=>{mode=mode==='dark'?'light':'dark';modeU=Date.now();applyMode();changed()});

function remove(id){
  notes.delete(id);nodes.delete(id);dead[id]=Date.now();render();changed();
}

/* ---------- search ---------- */
const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let terms=[];
const matches=e=>{if(!terms.length)return true;const t=fold(e.text);return terms.every(w=>t.includes(w))};
const esc=c=>c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c;
function paintMarks(hl,text){
  if(!terms.length){if(hl.childNodes.length)hl.textContent='';return}
  /* folding changes the length of a few characters; skip marks then rather than misplace them */
  const f=fold(text);
  if(f.length!==text.length){hl.textContent='';return}
  const hit=new Uint8Array(text.length);
  for(const w of terms){let i=0;while((i=f.indexOf(w,i))!==-1){hit.fill(1,i,i+w.length);i+=w.length}}
  let out='',open=false;
  for(let i=0;i<text.length;i++){
    if(hit[i]&&!open){out+='<mark>';open=true}
    if(!hit[i]&&open){out+='</mark>';open=false}
    out+=esc(text[i]);
  }
  if(open)out+='</mark>';
  hl.innerHTML=out+'\n';
}
qIn.addEventListener('input',()=>{terms=fold(qIn.value).split(/\s+/).filter(Boolean);render()});
qIn.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){qIn.value='';terms=[];render();comp.focus()}
  if(ev.key==='Enter'){ev.preventDefault();const first=list.querySelector('textarea');if(first)first.focus()}
});
document.addEventListener('keydown',ev=>{
  if((ev.metaKey||ev.ctrlKey)&&!ev.shiftKey&&!ev.altKey&&ev.key.toLowerCase()==='f'){ev.preventDefault();qIn.focus();qIn.select()}
});

/* ---------- rendering ---------- */
function nodeFor(e){
  let n=nodes.get(e.id);
  if(!n){
    const el=document.createElement('div');el.className='n';
    const row=document.createElement('div');row.className='row';
    const time=document.createElement('span');time.className='time mono';
    const pin=document.createElement('button');pin.className='pin mono';pin.type='button';
    pin.append('pin',document.createElement('span'));
    row.append(time,pin);
    const ed=document.createElement('div');ed.className='ed';
    const hl=document.createElement('div');hl.className='hl';hl.setAttribute('aria-hidden','true');
    const ta=document.createElement('textarea');ta.rows=1;ta.dataset.id=e.id;ta.setAttribute('aria-label','Note');
    ed.append(hl,ta);
    const id=e.id;
    ta.addEventListener('input',()=>{const cur=notes.get(id);if(!cur)return;cur.text=ta.value;cur.u=Date.now();autosize(ta);paintMarks(hl,ta.value);changed()});
    ta.addEventListener('blur',()=>{if(!notes.has(id))return;if(!ta.value.trim())remove(id);else{cacheNow();if(terms.length)setTimeout(render)}});
    ta.addEventListener('keydown',ev=>{if((ev.metaKey||ev.ctrlKey)&&ev.key==='Enter'){ev.preventDefault();comp.focus()}});
    pin.addEventListener('click',()=>{const cur=notes.get(id);if(!cur)return;cur.pin=!cur.pin;cur.u=Date.now();render();changed()});
    el.append(row,ed);n={el,ta,time,pin,hl};nodes.set(e.id,n);
  }
  n.time.textContent=fmtStamp(e.ts);
  n.pin.setAttribute('aria-pressed',String(e.pin));
  n.pin.setAttribute('aria-label',e.pin?'Unpin note':'Pin note to the top');
  n.pin.title=e.pin?'Pinned to the top':'Pin to the top';
  if(document.activeElement!==n.ta&&n.ta.value!==e.text)n.ta.value=e.text;
  paintMarks(n.hl,n.ta.value);
  return n.el;
}
/* pinned first, then newest first; editing never moves a note */
const order=(a,b)=>(b.pin-a.pin)||(b.ts-a.ts);
function render(){
  const act=document.activeElement,actId=act&&act.dataset?act.dataset.id:null;
  /* the note being edited stays put even if it stops matching mid-edit */
  const shown=[...notes.values()].filter(e=>e.id!==composerId&&(e.id===actId||(e.text.trim()&&matches(e)))).sort(order);
  countEl.textContent=terms.length?(shown.length===1?'1 note':shown.length+' notes'):'';
  const key=terms.join(' ')+'|'+shown.map(e=>e.id+(e.pin?'*':'')).join(',');
  if(key===structKey){shown.forEach(nodeFor);requestAnimationFrame(sizeAll);return}
  structKey=key;
  const s=actId?act.selectionStart:0,en=actId?act.selectionEnd:0;
  const els=shown.map(nodeFor);
  if(terms.length&&!shown.length){const p=document.createElement('p');p.className='empty mono';p.textContent='no notes match';els.push(p)}
  list.replaceChildren(...els);
  for(const id of [...nodes.keys()])if(!notes.has(id))nodes.delete(id);
  if(actId&&nodes.has(actId)){const t=nodes.get(actId).ta;if(document.activeElement!==t){t.focus({preventScroll:true});try{t.setSelectionRange(s,en)}catch(e){}}}
  requestAnimationFrame(sizeAll);
}
const sizeAll=()=>document.querySelectorAll('textarea').forEach(autosize);

function syncComposerUi(){
  const e=composerId&&notes.get(composerId);
  compTime.textContent=e?fmtStamp(e.ts):'now';
  newBtn.hidden=!e;
}
comp.addEventListener('input',()=>{
  autosize(comp);
  const text=comp.value;
  if(!composerId){
    if(!text.trim())return;
    const ts=Date.now();
    composerId='n'+ts.toString(36)+Math.random().toString(36).slice(2,6);
    notes.set(composerId,{id:composerId,ts,text,u:ts,pin:false});
    syncComposerUi();
  }
  const e=notes.get(composerId);
  if(!e){composerId=null;syncComposerUi();return}
  if(!text.trim()){const id=composerId;composerId=null;syncComposerUi();remove(id);return}
  e.text=text;e.u=Date.now();changed();
});
function commit(){
  if(!composerId)return;
  cacheNow();composerId=null;comp.value='';autosize(comp);syncComposerUi();render();
}
comp.addEventListener('keydown',ev=>{if((ev.metaKey||ev.ctrlKey)&&ev.key==='Enter'){ev.preventDefault();commit()}});
newBtn.addEventListener('click',()=>{commit();comp.focus()});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){cacheNow();if(dirty)sync()}
  else sync();
});
window.addEventListener('pagehide',cacheNow);
window.addEventListener('online',()=>sync());
setInterval(()=>{if(!document.hidden)sync()},60000);
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(sizeAll,150)});

function plainText(){
  return [...notes.values()].filter(e=>e.text.trim()).sort(order)
    .map(e=>fmtStamp(e.ts)+(e.pin?' pinned':'')+'\n'+e.text.trim()).join('\n\n\n');
}
$('#copyBtn').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(plainText());setStatus('copied')}catch(e){setStatus('copy refused')}
});

/* ---------- sync: one JSON file in a private GitHub repository ---------- */
const API='https://api.github.com',FILE='notes.json';
let busy=false,again=false,pushT=null;
function schedulePush(){if(!cfg)return;clearTimeout(pushT);pushT=setTimeout(()=>sync(),3000)}

const snapshot=()=>({v:1,mode,modeU,notes:Object.fromEntries([...notes].filter(([,e])=>e.text.trim()).map(([k,e])=>[k,pack(e)])),deleted:{...dead}});
function normal(d){
  const out={v:1,mode:'dark',modeU:0,notes:{},deleted:{}};
  if(!d||typeof d!=='object')return out;
  if(d.mode==='dark'||d.mode==='light'){out.mode=d.mode;out.modeU=+d.modeU||0}
  for(const [k,v] of Object.entries(d.notes||{})){const e=clean(k,v);if(e)out.notes[k]=pack(e)}
  for(const [k,t] of Object.entries(d.deleted||{}))if(typeof t==='number')out.deleted[k]=t;
  return out;
}
function merge(a,b){
  const E={},D={...a.deleted};
  for(const [k,t] of Object.entries(b.deleted))D[k]=Math.max(D[k]||0,t);
  for(const src of [a.notes,b.notes])for(const [k,e] of Object.entries(src))if(!E[k]||e.u>E[k].u)E[k]=e;
  for(const k of Object.keys(E))if(D[k]!=null){if(E[k].u<=D[k])delete E[k];else delete D[k]}
  const m=b.modeU>a.modeU?b:a;
  return {v:1,mode:m.mode,modeU:m.modeU,notes:E,deleted:D};
}
const sorted=v=>Array.isArray(v)?v.map(sorted):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,sorted(v[k])])):v;
const serial=o=>JSON.stringify(sorted(o),null,1)+'\n';
function adopt(m){
  const cur=merge(snapshot(),m);
  const next=new Map();
  for(const [k,e] of Object.entries(cur.notes))next.set(k,clean(k,e));
  if(composerId&&notes.has(composerId)&&!next.has(composerId)&&!cur.deleted[composerId])next.set(composerId,notes.get(composerId));
  for(const e of notes.values())if(!e.text.trim()&&!next.has(e.id)&&!cur.deleted[e.id])next.set(e.id,e);
  notes=next;dead=cur.deleted;
  if(cur.mode!==mode){mode=cur.mode;applyMode()}
  modeU=cur.modeU;
  render();syncComposerUi();
}
const enc=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)};
const dec=s=>{const r=atob(s.replace(/\s/g,''));const b=new Uint8Array(r.length);for(let i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return new TextDecoder().decode(b)};
class SyncError extends Error{constructor(msg,fatal){super(msg);this.fatal=fatal}}
async function gh(c,method,path,body){
  let r;
  try{r=await fetch(API+'/repos/'+c.repo+path,{method,cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined})}
  catch(e){throw new SyncError('offline, saved here')}
  if(r.status===401)throw new SyncError('token refused',true);
  if(r.status===403&&r.headers.get('x-ratelimit-remaining')==='0')throw new SyncError('github busy, will retry');
  return r;
}
async function pull(c){
  const r=await gh(c,'GET','/contents/'+FILE);
  if(r.status===404)return {sha:null,data:null};
  if(!r.ok)throw new SyncError(r.status===403?'token cannot read this repository':'sync error '+r.status,r.status===403);
  const j=await r.json();
  let b64=j.content||'';
  if(!b64&&j.size>0){const b=await gh(c,'GET','/git/blobs/'+j.sha);if(!b.ok)throw new SyncError('sync error '+b.status);b64=(await b.json()).content||''}
  let data=null;try{data=b64?JSON.parse(dec(b64)):null}catch(e){throw new SyncError('notes.json is not readable',true)}
  return {sha:j.sha,data};
}
async function sync(){
  if(!cfg)return;
  if(busy){again=true;return}
  busy=true;clearTimeout(pushT);
  const c=cfg;
  try{
    setStatus('syncing');
    for(let i=0;;i++){
      const {sha,data}=await pull(c);
      const remote=normal(data);
      dirty=false;
      const merged=merge(snapshot(),remote);
      adopt(merged);
      const out=serial(merged);
      if(data&&out===serial(remote))break;
      const r=await gh(c,'PUT','/contents/'+FILE,{message:'notes '+fmtStamp(Date.now()),content:enc(out),...(sha?{sha}:{})});
      if(r.ok)break;
      if((r.status===409||r.status===422)&&i<4)continue;
      throw new SyncError(r.status===403||r.status===404?'token cannot write to this repository':'sync error '+r.status,r.status===403||r.status===404);
    }
    if(cfg===c){setStatus('synced');syncMsg('Last synced '+fmtStamp(Date.now())+'.')}
  }catch(e){
    dirty=true;
    setStatus(e.message||'offline, saved here');
    if(e.fatal)syncMsg('Sync paused: '+e.message+'. Check the repository name and token, then connect again.');
  }finally{
    busy=false;cacheNow();
    if(again){again=false;sync()}
  }
}

/* ---------- sync panel ---------- */
const panel=$('#panel'),syncLink=$('#syncLink'),repoIn=$('#repo'),tokenIn=$('#token');
const syncMsg=t=>{$('#syncMsg').textContent=t};
function panelUi(){
  $('#setup').hidden=!!cfg;
  $('#connectBtn').hidden=!!cfg;
  $('#syncBtn').hidden=$('#disconnectBtn').hidden=!cfg;
  $('#syncState').textContent=cfg?cfg.repo:'not connected';
  if(!cfg){syncMsg('Notes are kept on this device only. Connect a private GitHub repository to sync between devices.');setStatus('this device only')}
}
syncLink.addEventListener('click',()=>{
  panel.hidden=!panel.hidden;syncLink.setAttribute('aria-expanded',String(!panel.hidden));
  if(!panel.hidden)panel.scrollIntoView({behavior:'smooth',block:'start'});
});
$('#connectBtn').addEventListener('click',async()=>{
  const repo=repoIn.value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  const token=tokenIn.value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){syncMsg('Write the repository as username/name.');return}
  if(!token){syncMsg('Paste the access token.');return}
  syncMsg('Checking…');
  const c={repo,token};
  try{
    const r=await gh(c,'GET','');
    if(r.status===404||r.status===403){syncMsg('That repository was not found, or the token cannot see it.');return}
    if(!r.ok){syncMsg('GitHub answered '+r.status+'. Try again.');return}
    const j=await r.json();
    if(!j.private){syncMsg('That repository is public. Make it private first, so nobody else can read your notes.');return}
  }catch(e){syncMsg(e.fatal?'GitHub refused that token.':'Could not reach GitHub. Check the connection.');return}
  cfg=c;LS.set('n.sync',cfg);tokenIn.value='';dirty=true;panelUi();syncMsg('Connected. Syncing…');sync();
});
$('#syncBtn').addEventListener('click',()=>sync());
$('#disconnectBtn').addEventListener('click',()=>{
  cfg=null;LS.del('n.sync');panelUi();
  syncMsg('Disconnected. Notes stay on this device and in the repository.');
});

/* import the plain text that "copy all as text" produces */
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};
function parseText(t){
  const lines=t.replace(/\r\n?/g,'\n').split('\n'),out=[];
  const stampRe=/^([01]\d|2[0-3]):([0-5]\d) (\d{2})-(\d{2})-(\d{2})( pinned)?$/;
  let cur=null;
  const end=()=>{if(cur){const text=cur.lines.join('\n').trim();if(text)out.push({...cur,text})}cur=null};
  lines.forEach((l,i)=>{
    const s=l.trim(),blank=i===0||!lines[i-1].trim();
    const m=blank&&s.match(stampRe);
    if(m){end();cur={y:2000+ +m[5],mo:+m[4]-1,d:+m[3],h:+m[1],mi:+m[2],pin:!!m[6],lines:[]};return}
    if(cur)cur.lines.push(l);
  });
  end();return out;
}
$('#importBtn').addEventListener('click',()=>{
  const ta=$('#importText'),items=parseText(ta.value);
  if(!items.length){setStatus('nothing to import');return}
  const seen=new Map();let added=0;
  for(const it of items){
    const base=new Date(it.y,it.mo,it.d,it.h,it.mi).getTime();
    const n=seen.get(base)||0;seen.set(base,n+1);
    const ts=base+n*1000,id='i'+hash(base+'|'+it.text);
    if(notes.has(id)||dead[id])continue;
    notes.set(id,{id,ts,text:it.text,u:Date.now(),pin:it.pin});added++;
  }
  ta.value='';autosize(ta);render();changed();
  setStatus(added?'imported '+added:'already imported');
});

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
